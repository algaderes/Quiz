<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Ikhtibar</title>
    <script>
        // Redirect to main index with 404 flag
        // This file is served by hosting platforms (GitHub Pages, Netlify, etc.)
        // when a page is not found. It redirects to the main Hub with a 404 overlay.
        var currentUrl = window.location.href;
        var cleanUrl = currentUrl.split('?')[0].split('#')[0];
        var targetUrl = 'index.html?error=404';
        
        var pagesIndex = cleanUrl.indexOf('/pages/');
        var srcIndex = cleanUrl.indexOf('/src/');
        
        if (pagesIndex !== -1) {
            targetUrl = currentUrl.substring(0, pagesIndex) + '/index.html?error=404';
        } else if (srcIndex !== -1) {
            targetUrl = currentUrl.substring(0, srcIndex) + '/index.html?error=404';
        }
        
        window.location.replace(targetUrl);
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=index.html?error=404">
    </noscript>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
