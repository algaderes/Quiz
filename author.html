<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3X91F7157F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3X91F7157F');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عن المشروع والمؤلف | منصة اختبار</title>
    <link rel="stylesheet" href="src/styles.css">
    <link rel="icon" href="src/app.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --author-bg: #0f0f11;
            --author-card: #1a1a1e;
        }
        
        [data-theme="light"] {
            --author-bg: #f5f5f7;
            --author-card: #ffffff;
        }

        body {
            background-color: var(--author-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .author-container {
            max-width: 800px;
            width: 90%;
            padding: 40px;
            background: var(--author-card);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .author-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0,255,65,0.05) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ff41, #0088cc);
            margin: 0 auto 24px;
            padding: 4px;
            box-shadow: 0 10px 30px rgba(0,255,65,0.2);
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
        }

        h1 { margin: 0; font-size: 2.2rem; font-weight: 800; }
        .tagline { color: var(--accent-color); font-weight: 600; margin-top: 8px; }
        
        .bio {
            margin: 32px 0;
            line-height: 1.8;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-val { font-size: 1.5rem; font-weight: 800; color: #fff; }
        .stat-lbl { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }

        .back-home {
            margin-top: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-home:hover { color: var(--accent-color); }

        .social-links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            background: rgba(255,255,255,0.05);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s;
        }

        .social-btn:hover {
            background: var(--accent-color);
            color: #000;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="author-container">
        <div class="content">
            <div class="profile-img">
                <img src="src/app.png" alt="Author">
            </div>
            <h1 id="authorName">عباس عبد الرزاق</h1>
            <div class="tagline" id="authorTitle">مطور ومصمم واجهات</div>
            
            <p class="bio" id="projectBio">
                مشروع <b>منصة اختبار</b> هو مبادرة تهدف لتسهيل عملية المراجعة والاختبار الذاتي للطلاب. 
                تم تصميم المنصة لتكون سريعة، بديهية، وتعمل دون الحاجة لاتصال دائم بالإنترنت، مع التركيز على تجربة المستخدم والجمالية البصرية.
            </p>

            <div class="social-links">
                <a href="https://t.me/Abb1s0" target="_blank" class="social-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2L2 10l8 2 2 9 9-19z"></path></svg>
                </a>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-val">v1.0.2</div>
                    <div class="stat-lbl" id="lblVersion">الإصدار الحالي</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val">2024</div>
                    <div class="stat-lbl" id="lblYear">تاريخ الإطلاق</div>
                </div>
            </div>

            <a href="index.html" class="back-home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span id="btnBack">العودة للمنصة</span>
            </a>
        </div>
    </div>

    <script>
        // Apply theme on load
        const theme = localStorage.getItem('ikhtibar_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        
        // Simple localization for author page
        const lang = localStorage.getItem('ikhtibar_lang') || 'ar';
        if (lang === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
            document.title = 'About Project & Author | Ikhtibar';
            document.getElementById('authorName').innerText = 'Abbas Abdul-Razzaq';
            document.getElementById('authorTitle').innerText = 'Developer & UI Designer';
            document.getElementById('projectBio').innerHTML = '<b>Ikhtibar Project</b> is an initiative aimed at simplifying self-review and testing for students. The platform is designed to be fast, intuitive, and works offline, focusing on user experience and visual aesthetics.';
            document.getElementById('lblVersion').innerText = 'Current Version';
            document.getElementById('lblYear').innerText = 'Launch Year';
            document.getElementById('btnBack').innerText = 'Back to Platform';
        }
    </script>
</body>
</html>
